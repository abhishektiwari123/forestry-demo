; Pokemon AI Auto-Improvement - Supervisor Configuration
;
; Supervisor is a process control system that keeps processes running 24/7
;
; Installation:
;   pip install supervisor
;
; Usage:
;   supervisord -c scripts/supervisor.conf
;
; Commands:
;   supervisorctl -c scripts/supervisor.conf status
;   supervisorctl -c scripts/supervisor.conf restart all
;   supervisorctl -c scripts/supervisor.conf stop all
;   supervisorctl -c scripts/supervisor.conf tail -f image_daemon

[supervisord]
logfile=%(here)s/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=%(here)s/supervisord.pid
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/supervisor.sock

[unix_http_server]
file=%(here)s/supervisor.sock

; ============================================================
; Image Improvement Daemon
; ============================================================
[program:image_daemon]
command=python3 %(here)s/auto_improvement_daemon.py
directory=%(here)s
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=10
stderr_logfile=%(here)s/logs/image_daemon_err.log
stdout_logfile=%(here)s/logs/image_daemon_out.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
user=root
environment=PYTHONUNBUFFERED="1"

; ============================================================
; Code Improvement Daemon
; ============================================================
[program:code_daemon]
command=python3 %(here)s/code_improvement_daemon.py
directory=%(here)s
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=10
stderr_logfile=%(here)s/logs/code_daemon_err.log
stdout_logfile=%(here)s/logs/code_daemon_out.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
user=root
environment=PYTHONUNBUFFERED="1"

; ============================================================
; Watchdog (optional - monitors both daemons)
; ============================================================
[program:watchdog]
command=python3 %(here)s/watchdog.py
directory=%(here)s
autostart=false
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=10
stderr_logfile=%(here)s/logs/watchdog_err.log
stdout_logfile=%(here)s/logs/watchdog_out.log
user=root
environment=PYTHONUNBUFFERED="1"
priority=100

; ============================================================
; Group all daemons together
; ============================================================
[group:pokemon_ai]
programs=image_daemon,code_daemon
priority=999
